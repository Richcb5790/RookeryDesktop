<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="24" height="24" role="img" aria-label="Loading">
<style>
  .orbit { transform-origin: 100px 100px; animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .orbit { animation-duration: 3s; } }
</style>
<circle cx="100" cy="100" r="72" fill="none" stroke="#8A94B8" stroke-opacity=".45" stroke-width="16"/>
<circle cx="100" cy="100" r="30" fill="#FF6B6B" stroke="#0E1734" stroke-width="12"/>
<g class="orbit">
  <circle cx="100" cy="100" r="72" fill="none" stroke="#4CC9F0" stroke-width="16" stroke-linecap="round" stroke-dasharray="110 343" transform="rotate(-150 100 100)"/>
  <circle cx="100" cy="28" r="22" fill="#4CC9F0" stroke="#0E1734" stroke-width="10"/>
</g>
</svg>